name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          npm ci --prefix frontend
      - name: Backend tests (no provider calls)
        env:
          ACTIVE_LLM: groq
          GROQ_API_KEY: offline-fixture
        run: python -m unittest discover -s tests -v
      - name: Frontend component, stream and download tests
        run: |
          npm test --prefix frontend
          npm run format:check --prefix frontend
      - name: Production public-demo build
        env:
          VITE_PUBLIC_DEMO: 'true'
        run: npm run build --prefix frontend
      - name: Actual Docker integration (no model calls)
        env:
          MINI_DEVIN_LIVE_DOCKER: '1'
        run: |
          docker pull python:3.12-slim
          python -m unittest tests.test_live_docker -v
      - name: Dependency and whitespace checks
        run: |
          python -m pip check
          git diff --check
